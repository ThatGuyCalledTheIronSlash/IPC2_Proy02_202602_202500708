<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Biblioteca 202500708</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
<!-- Cuerpo de la pagina -->
        <body>
            <div class="contenedor">    
                <h1>Bienvenido al Proyecto 2 de IPC2 N 2026</h1>
                    <p> Bienvenido a la biblioteca virtual. Desde aquí se gestionan los archivos XML y la visualización en Graphviz</p>
            <div class = "panel">
                <button id="btnInicializar">Inicializar Catálogo</button>
            </div>

            <div class = "panel">
                <h2>Cargar Catalogo XML</h2>
                    <input type="file" id="archivoXml" accept=".xml" />
                    <button id="btnCargar">Subir y Procesar</button>
                        <p id="mensajeEstado" style="font-weight: bold; color: #d35400;"></p>
            </div>
        </div> 
    <script>
        // Boton Inicializar
        document.getElementById('btnInicializar').addEventListener('click', async () => {
            const respuesta = await fetch('/api/inicializar', { method: 'POST' });
            const resultado = await respuesta.json();
            document.getElementById('mensajeEstado').innerText = resultado.mensaje;
        });
        // Boton Cargar XML
        document.getElementById('btnCargar').addEventListener('click', async () => {
            const inputArchivo = document.getElementById('archivoXml');
            
            // Validar que el usuario haya seleccionado un archivo
            if (inputArchivo.files.length === 0) {
                alert("Por favor, selecciona un archivo XML primero.");
                return;
            }
            const formData = new FormData();
            formData.append("archivo", inputArchivo.files[0]);

            //Enviar archivo al backend para procesarlo
            document.getElementById('mensajeEstado').innerText = "Procesando XML...";

            try {
                const respuesta = await fetch('/api/cargar-xml', {
                    method: 'POST',
                    body: formData
            });

            const resultado = await respuesta.json();
                document.getElementById('mensajeEstado').innerText = resultado.mensaje;
            } catch (error) {
                document.getElementById('mensajeEstado').innerText = "Error de conexión al subir el archivo.";
            }
        }); 
    </script>    
        
    
    </body>
</html>
